<style>
:root{--bg:#e3f3ef;--deep:#12435a;--red:#e0483e;--mint:#2fc29a;--sun:#ffc933;--sky:#3f8cff;--ink:#1d2b3a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--deep);color:#fff}
h1{font-size:21px;margin:0 10px 0 0;font-family:"KaiTi","STKaiti","Kaiti SC",serif;letter-spacing:2px}
.chip{font:28px "KaiTi","STKaiti","Kaiti SC",serif;width:50px;height:50px;border-radius:50%;border:3px solid #7fc8c0;background:transparent;color:#fff;cursor:pointer}
.chip.on{background:var(--sun);color:var(--deep);border-color:var(--sun)}
header form{display:flex;gap:6px;margin-left:auto}
input{font-size:20px;width:130px;padding:8px 10px;border-radius:10px;border:0}
button.b{font-size:16px;padding:10px 16px;border:0;border-radius:12px;background:var(--sky);color:#fff;cursor:pointer;font-weight:700}
button.b.g{background:var(--mint);color:#06382b}button.b.y{background:var(--sun);color:#4a3600}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
main{flex:1;display:flex;gap:20px;justify-content:center;align-items:center;padding:14px;flex-wrap:wrap}
#stage{position:relative;width:min(94vw,calc(100vh - 130px),740px);aspect-ratio:1;border-radius:16px;overflow:hidden;background:#fffef8;box-shadow:0 0 0 6px var(--red),0 10px 30px #0004;touch-action:none}
video,canvas{position:absolute;inset:0;width:100%;height:100%}
video{object-fit:cover;transform:scaleX(-1);display:none}
#side{width:270px;display:flex;flex-direction:column;gap:12px}
#bubble{background:#fff;border-radius:18px;padding:14px 16px;font-size:18px;line-height:1.5;min-height:110px;border:3px solid var(--deep);position:relative}
#bubble b{font-size:30px;display:block}
#dots{display:flex;flex-wrap:wrap;gap:6px}
#dots i{width:22px;height:22px;border-radius:50%;background:#c4d8d4;display:grid;place-items:center;font:600 12px system-ui;color:#fff;font-style:normal}
#dots i.done{background:var(--mint)}#dots i.cur{background:var(--red);transform:scale(1.25)}
#cam{font-size:14px;color:#3b5a63}
#res{position:absolute;inset:0;background:#12435aee;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
#res .big{font:90px/1 "KaiTi","STKaiti",serif;color:var(--sun)}
#stars{font-size:44px;letter-spacing:6px}
#bars{width:min(420px,90%);display:grid;grid-template-columns:90px 1fr 38px;gap:6px 8px;align-items:center;font-size:15px;text-align:left}
#bars div.t{height:12px;background:#ffffff33;border-radius:6px;overflow:hidden}
#bars div.t span{display:block;height:100%;background:var(--mint)}
#msg{font-size:19px;max-width:440px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

15 469 589 461 Q 529 445 480 433 C 431 421 464 398 512 409 Z","M 463 681 Q 444 696 426 704 Q 407 711 396 705 Q 384 698 394 681 Q 457 557 417 149 Q 416 94 373 37 Q 360 19 370 -6 Q 383 -36 397 -48 Q 413 -57 425 -37 Q 441 -3 596 139 Q 615 155 620 165 Q 624 177 613 176 Q 607 176 480 102 Q 471 95 469 105 Q 478 265 479 397 L 480 433 Q 479 482 478 528 L 477 554 Q 480 602 486 649 C 488 664 488 664 463 681 Z","M 661 274 Q 709 299 793 353 Q 814 368 839 376 Q 861 383 852 403 Q 839 422 814 438 Q 792 454 778 452 Q 765 452 768 438 Q 768 411 693 334 Q 671 313 645 287 C 624 266 634 260 661 274 Z","M 645 287 Q 585 338 512 409 C 490 430 455 415 479 397 Q 504 381 525 355 Q 655 207 758 105 Q 777 86 805 88 Q 908 100 946 110 Q 964 113 969 122 Q 973 129 962 133 Q 790 175 697 246 Q 679 259 661 274 L 645 287 Z"],"medians":[[[192,780],[284,726],[312,684]],[[128,527],[207,471],[223,448]],[[201,44],[189,75],[187,129],[222,185],[329,391]],[[521,857],[609,814],[638,779]],[[476,682],[494,671],[661,716],[693,710],[720,681],[722,672],[693,580],[659,422]],[[485,535],[494,546],[569,565],[612,562]],[[483,403],[496,420],[543,433],[612,445],[626,435]],[[405,692],[438,660],[448,639],[450,613],[456,362],[439,90],[443,69],[448,62],[487,74],[614,169]],[[777,442],[787,431],[797,401],[691,309],[663,288],[653,289]],[[486,394],[510,392],[675,229],[791,139],[852,128],[960,124]]]}};
const cache={...PRE},$=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d'),video=$('vid');
let chars=['奔','牵','浪'],ci=0,G=null,S=600,dpr=1,camOn=false,hands=null;
const TOL=105,START=135,M=0.04;
let si,started,p,cur,trails,recs,orderErr,offCount,lastDown,hint,hintT,done,finishAt,offSince,parts=[],lastOrder=0;
const F={x:0,y:0,down:false,vis:false,sx:0,sy:0};

function resize(){dpr=devicePixelRatio||1;S=stage.clientWidth;cv.width=cv.height=Math.round(S*dpr)}
addEventListener('resize',resize);
const K=()=>S*(1-2*M)/1024, toG=(px,py)=>[(px-S*M)/K(),(py-S*M)/K()];
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function resample(pt,n){const L=[0];for(let i=1;i<pt.length;i++)L.push(L[i-1]+dist(pt[i],pt[i-1]));const T=L[L.length-1],o=[];let j=1;
 for(let i=0;i<n;i++){const t=T*i/(n-1);while(j<L.length-1&&L[j]<t)j++;const a=pt[j-1],b=pt[j],u=(t-L[j-1])/((L[j]-L[j-1])||1);o.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}return o}

async function getData(c){
 if(cache[c])return cache[c];
 const r=await fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/'+encodeURIComponent(c)+'.json');
 if(!r.ok)throw 0;const j=await r.json();return cache[c]={strokes:j.strokes,medians:j.medians}}
async function loadChar(i){
 ci=i;const raw=await getData(chars[i]);
 G={d:raw.strokes.map(s=>new Path2D(s)),P:raw.medians.map(m=>resample(m.map(([x,y])=>[x,900-y]),48))};
 resetWrite();chips()}
function chips(){$('chips').innerHTML='';chars.forEach((c,i)=>{const b=document.createElement('button');b.className='chip'+(i==ci?' on':'');b.textContent=c;b.onclick=()=>loadChar(i);$('chips').append(b)})}
function resetWrite(){si=0;started=false;p=0;cur=[];trails=[];recs=[];orderErr=0;offCount=0;lastDown=0;hint=0;done=false;finishAt=0;offSince=0;parts=[];
 $('res').style.display='none';dots();
 say(`<b>${chars[ci]}</b>一共 ${G.P.length} 笔。伸出食指，从<span style="color:#1a9a4a">绿色圆点</span>出发，跟着箭头走吧！`)}
function dots(){$('dots').innerHTML=G.P.map((_,i)=>`<i class="${i<si?'done':i==si?'cur':''}">${i+1}</i>`).join('')}
function say(h){$('bubble').innerHTML=h}
function setHint(t){if(hintT!==t){hintT=t;say(t)}}

/* ---------- 书写判定 ---------- */
function feed(g,down,now){
 if(done||!G)return;
 const P=G.P[si];
 if(down)lastDown=now;
 if(!started){
  if(down&&dist(g,P[0])<START){started=true;p=0;cur=[g];offSince=0;setHint('很好！顺着箭头慢慢移动～')}
  else if(down&&now-lastOrder>1800){
   for(let k=si+1;k<G.P.length;k++)if(dist(g,G.P[k][0])<80&&dist(g,P[0])>260){orderErr++;lastOrder=now;setHint('先写这一笔哦，笔顺不能跳！');break}}
  return}
 if(!down){if(now-lastDown>1500){started=false;cur=[];setHint('笔抬太久啦，从绿点重新开始吧')}return}
 cur.push(g);
 let best=p,bd=1e9,near=1e9,ni=0;
 for(let j=Math.max(0,p-2);j<Math.min(P.length,p+9);j++){const d=dist(g,P[j]);if(d<near){near=d;ni=j}if(j>=p&&d<TOL)best=j}
 if(best>p)p=best;
 const rec=recs[si]||(recs[si]={back:0,n:0,dev:0,pts:[]});
 rec.n++;rec.dev+=near;rec.pts.push(g);if(ni<p-3)rec.back++;
 if(near>TOL*1.5){if(!offSince){offSince=now;offCount++}hint=1;setHint('偏出去啦，跟着小星星的路线走吧！');
  if(now-offSince>2500){started=false;cur=[];offSince=0;hint=0;recs[si]=null;setHint('再试一次！回到绿点重新写这一笔')}}
 else{offSince=0;hint=0}
 if(p>=P.length-1){
  trails.push({pts:cur,hue:(si*47)%360});cur=[];started=false;hint=0;
  burst(P[P.length-1]);ding();si++;dots();
  if(si>=G.P.length){done=true;finishAt=now+1400;say(`<b>🎉 ${chars[ci]}</b>全部写完啦！看看你写的字～`)}
  else say(`第 ${si} 笔完成 ⭐ 下一笔从绿点开始！`)}}

/* ---------- 评估 ---------- */
function evaluate(){
 const cl=v=>Math.round(Math.max(35,Math.min(100,v)));
 let dev=0,n=0,back=0,posR=0,all=[],std=[];
 G.P.forEach((P,i)=>{const r=recs[i];std.push(...P);if(!r)return;dev+=r.dev;n+=r.n;back+=r.back;all.push(...r.pts);
  const c=a=>[a.reduce((s,q)=>s+q[0],0)/a.length,a.reduce((s,q)=>s+q[1],0)/a.length];posR+=dist(c(r.pts),c(P))/TOL});
 n=n||1;posR/=G.P.length;
 const bb=a=>{const x=a.map(q=>q[0]),y=a.map(q=>q[1]),x0=Math.min(...x),x1=Math.max(...x),y0=Math.min(...y),y1=Math.max(...y);
  return{w:x1-x0||1,h:y1-y0||1,cx:(x0+x1)/2,cy:(y0+y1)/2,mx:(a.reduce((s,q)=>s+q[0],0)/a.length-x0)/(x1-x0||1),my:(a.reduce((s,q)=>s+q[1],0)/a.length-y0)/(y1-y0||1)}};
 const U=all.length?bb(all):bb(std),T=bb(std);
 const frame=Math.abs(U.w/U.h-T.w/T.h)/(T.w/T.h)*60+(Math.abs(U.mx-T.mx)+Math.abs(U.my-T.my))*120;
 const shape=Math.hypot(U.cx-T.cx,U.cy-T.cy)/1024*220+Math.abs(Math.sqrt(U.w*U.h)/Math.sqrt(T.w*T.h)-1)*70;
 return[
  ['笔顺准确',cl(100-orderErr*10)],
  ['轨迹准确',cl(100-dev/n/TOL*55-offCount*3)],
  ['笔画方向',cl(100-back/n*160)],
  ['笔画位置',cl(100-posR*70)],
  ['间架结构',cl(100-frame)],
  ['整体字形',cl(100-shape)]]}
function showResult(){
 const sc=evaluate(),avg=sc.reduce((s,a)=>s+a[1],0)/6,low=sc.slice().sort((a,b)=>a[1]-b[1])[0];
 $('rc').textContent=chars[ci];
 $('stars').textContent='⭐'.repeat(avg>=85?3:avg>=70?2:1)+'☆'.repeat(avg>=85?0:avg>=70?1:2);
 $('bars').innerHTML=sc.map(([k,v])=>`<span>${k}</span><div class="t"><span style="width:${v}%"></span></div><b>${v}</b>`).join('');
 const tip={'笔顺准确':'记住笔顺口诀，一笔一笔来哦！','轨迹准确':'再试一次！慢一点，跟着小星星的路线走吧！','笔画方向':'注意箭头方向，别走回头路哦！','笔画位置':'每一笔要写在田字格的正确位置哦！','间架结构':'做得不错！记得让左右两边的距离更合适哦！','整体字形':'字要写得端正，重心稳稳放在格子中央！'}[low[0]];
 $('msg').textContent=avg>=85?'太厉害了！你的手指跟着轨迹走得很准确！恭喜你完成了，你已经成为汉字小达人啦！':avg>=70?'做得不错！'+tip:'加油！'+tip;
 $('res').style.display='flex'}

/* ---------- 绘制 ---------- */
function burst(pt){const k=K();for(let i=0;i<14;i++){const a=Math.random()*6.28,v=2+Math.random()*4;
 parts.push({x:S*M+pt[0]*k,y:S*M+pt[1]*k,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,c:['⭐','✨','🌸'][i%3]})}}
let ac;function ding(){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
 g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.4);o.start();o.stop(ac.currentTime+.4);o.frequency.setValueAtTime(1320,ac.currentTime+.12)}catch(e){}}
function poly(P,to){ctx.beginPath();P.slice(0,to+1).forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]))}
function draw(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);
 ctx.fillStyle=camOn?'rgba(255,254,248,.55)':'#fffef8';ctx.fillRect(0,0,S,S);
 // 田字格
 ctx.strokeStyle='#e0483e';ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.beginPath();
 ctx.moveTo(S/2,0);ctx.lineTo(S/2,S);ctx.moveTo(0,S/2);ctx.lineTo(S,S/2);ctx.stroke();ctx.setLineDash([]);
 if(!G)return;
 ctx.save();ctx.translate(S*M,S*M);ctx.scale(K(),K());
 ctx.save();ctx.translate(0,900);ctx.scale(1,-1);
 G.d.forEach((d,i)=>{ctx.fillStyle=i<si?'#23305a':i==si&&!done?'rgba(255,122,61,.38)':'rgba(70,70,90,.13)';ctx.fill(d)});
 ctx.restore();
 ctx.lineCap=ctx.lineJoin='round';
 trails.forEach(tr=>{ctx.strokeStyle=`hsla(${tr.hue},85%,55%,.55)`;ctx.lineWidth=14;poly(tr.pts,tr.pts.length-1);ctx.stroke()});
 if(!done&&si<G.P.length){
  const P=G.P[si];
  ctx.lineWidth=16;ctx.strokeStyle='rgba(63,140,255,.85)';if(started){poly(P,p);ctx.stroke()}
  if(cur.length>1){ctx.strokeStyle=`hsl(${(si*47)%360},90%,50%)`;ctx.lineWidth=14;poly(cur,cur.length-1);ctx.stroke()}
  ctx.setLineDash([26,22]);ctx.lineDashOffset=-t/18;ctx.strokeStyle='#ff6a1f';ctx.lineWidth=11;poly(P,P.length-1);ctx.stroke();ctx.setLineDash([]);
  // 动态箭头
  for(let k=0;k<3;k++){const u=((t/1800+k/3)%1)*(P.length-2),i=Math.floor(u),a=P[i],b=P[i+1],f=u-i,x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f,ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
   ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle='#fff';ctx.strokeStyle='#d6410d';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(34,0);ctx.lineTo(-18,-28);ctx.lineTo(-18,28);ctx.closePath();ctx.stroke();ctx.fill();ctx.restore()}

  const pulse=1+.25*Math.sin(t/220);

  ctx.fillStyle='#1fa561';ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.arc(P[0][0],P[0][1],34,0,6.3);ctx.stroke();ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(si+1,P[0][0],P[0][1]+2);
  const e=P[P.length-1];ctx.fillStyle='#e0483e';ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.rect(e[0]-26,e[1]-26,52,52);ctx.stroke();ctx.fill();

 // 光点

function frame(t){
 if(F.vis){F.sx+=(F.x-F.sx)*.55;F.sy+=(F.y-F.sy)*.55;if(!F.sx&&!F.sy){F.sx=F.x;F.sy=F.y}
  if(!done)feed(toG(F.sx,F.sy),F.down,t)}
 if(done&&finishAt&&t>finishAt){finishAt=0;showResult()}
 draw(t);requestAnimationFrame(frame)}

/* ---------- 输入：鼠标 / 触摸（演示） ---------- */
let ptr=false;
function pp(e){const r=stage.getBoundingClientRect();F.x=(e.clientX-r.left)*S/r.width;F.y=(e.clientY-r.top)*S/r.height;F.vis=true}
stage.addEventListener('pointerdown',e=>{if($('res').style.display=='flex')return;ptr=true;pp(e);F.sx=F.x;F.sy=F.y;F.down=true});
stage.addEventListener('pointermove',e=>{if(ptr||!camOn){pp(e)}});
addEventListener('pointerup',()=>{if(ptr){ptr=false;F.down=false}});

/* ---------- AR 手指追踪 ---------- */
let lastHand=0;
function onRes(r){
 const L=r.multiHandLandmarks&&r.multiHandLandmarks[0];
 if(!L){if(performance.now()-lastHand>400){F.vis=false;F.down=false}return}
 lastHand=performance.now();
 const d=(a,b)=>Math.hypot(L[a].x-L[b].x,L[a].y-L[b].y);
 const idx=d(0,8)>d(0,6)*1.15,mid=d(0,12)>d(0,10)*1.05;
 const vw=video.videoWidth,vh=video.videoHeight,sc=Math.max(S/vw,S/vh);
 F.x=(1-L[8].x)*vw*sc-(vw*sc-S)/2;F.y=L[8].y*vh*sc-(vh*sc-S)/2;
 F.vis=true;F.down=idx&&!mid}
async function startCam(){
 try{
  $('camBtn').textContent='正在启动…';
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
  video.srcObject=st;await video.play();video.style.display='block';camOn=true;
  hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.5});
  hands.onResults(onRes);
  (async function tick(){if(video.readyState>=2)await hands.send({image:video});requestAnimationFrame(tick)})();
  $('camBtn').textContent='摄像头已开启 ✓';say('摄像头开好啦！把食指伸到镜头前，看到<b style="display:inline">黄色光点</b>跟着手指就对了～')
 }catch(e){$('camBtn').textContent='开启摄像头 · 用食指书空';say('打不开摄像头。请允许浏览器使用摄像头（需用 https 或 localhost 打开），或先用鼠标/手指描写。')}}

$('camBtn').onclick=startCam;$('redo').onclick=()=>resetWrite();
$('again').onclick=()=>resetWrite();
$('next').onclick=()=>loadChar((ci+1)%chars.length);
$('f').onsubmit=async e=>{e.preventDefault();
 const list=[...new Set([...$('inp').value].filter(c=>/[\u4e00-\u9fff]/.test(c)))];if(!list.length)return;
 const ok=[];for(const c of list){try{await getData(c);ok.push(c)}catch(_){}}
 if(!ok.length){say('没找到这个字的笔顺数据，换一个常用字试试（需联网）。');return}
 chars=[...new Set([...chars,...ok])];$('inp').value='';await loadChar(chars.indexOf(ok[0]))};
resize();loadChar(0).then(()=>requestAnimationFrame(frame));
</script></body></html>
